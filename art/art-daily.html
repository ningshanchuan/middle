    CN:{en:'China',zh:'中国'}, US:{en:'US',zh:'美国'}, both:{en:'China & US',zh:'中美'},
    GB:{en:'UK',zh:'英国'}, FR:{en:'France',zh:'法国'}, RU:{en:'Russia',zh:'俄罗斯'},
    JP:{en:'Japan',zh:'日本'}, AT:{en:'Austria',zh:'奥地利'}, SE:{en:'Sweden',zh:'瑞典'},
    world:{en:'Global',zh:'全球'}
  };
  const ALL = {en:'All',zh:'全部'};
  const days = DAILY.slice().sort((a, b) => a.date.localeCompare(b.date));
  const first = days[0];
  const last = days.at(-1);
  const typeFilters = [['', ALL], ...Object.entries(TYPES).filter(([type]) => days.some(item => item.type === type))];
  const countryFilters = [['', ALL], ['CN', COUNTRIES.CN], ['US', COUNTRIES.US]];
  const filters = {type:'', country:''};
  const rail = $('#daily-rail');
  const archiveDetail = $('#daily-archive-detail');
  const failedImages = new Set();
  let opened = '';
  let renderedDate;
  let midnightTimer;

  function dateKey(date) {
    // These are local calendar dates. An ISO timestamp would follow UTC.
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return date.getFullYear() + '-' + month + '-' + day;
  }

  function localDate(key) {
    const [year, month, day] = key.split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  function dateLabel(key, full = false) {
    const locale = Lab.lang === 'zh' ? 'zh-CN' : 'en-US';
    const options = {month: full ? 'long' : 'short', day:'numeric'};
    if (full) options.year = 'numeric';
    return new Intl.DateTimeFormat(locale, options).format(localDate(key));
  }

  function node(tag, className, content) {
    const result = document.createElement(tag);
    if (className) result.className = className;
    if (content != null) result.textContent = content;
    return result;
  }

  function time(key, full) {
    const result = node('time', '', dateLabel(key, full));
    result.dateTime = key;
    return result;
  }

  function link(item) {
    const result = node('a', '', L(item.label));
    result.href = item.url;
    result.target = '_blank';
    result.rel = 'noopener noreferrer';
    return result;
  }

  function note(id, message) {
    const result = $(id);
    result.hidden = !message;
    result.textContent = L(message);
  }

  function card(item, variant = 'small') {
    const feature = variant === 'feature';
    const article = node('article', feature ? 'daily-feature' : 'daily-small');
    const copy = feature ? node('div', 'daily-feature-copy') : article;
    const meta = node('p', 'daily-meta');
    const labels = [L(TYPES[item.type]), L(COUNTRIES[item.country] || item.country), L(item.age)].filter(Boolean);
    if (item.start) {
      labels.unshift(L(item.start > renderedDate ? {en:'Upcoming',zh:'即将开始'} : {en:'On now',zh:'展演中'}));
      meta.append(time(item.start, true));
      if (item.start !== item.end) meta.append(' – ', time(item.end, true));
      meta.append(' · ');
    } else if (item.date) {
      meta.append(time(item.date, feature), ' · ');
    }
    meta.append(labels.join(' · '));
    const title = L(item);
    const why = L(item.why);
    copy.append(meta, node('h3', '', title), node('p', 'daily-why', why));

    const links = node('div', 'daily-links');
    links.append(...item.links.map(link));
    if (feature) {
      const speak = node('button', 'daily-speak', L(Lab.UI.listen));
      speak.type = 'button';
      speak.addEventListener('click', () => Lab.speak(title.replace(/[《》]/g, '') + (Lab.lang === 'zh' ? '。' : '. ') + why));
      const actions = node('div', 'daily-actions');
      actions.append(links, speak);
      copy.append(actions);
      article.append(copy);
    } else {
      copy.append(links);
    }

    if (feature) article.classList.add('is-text-only');
    if (item.img && !failedImages.has(item.img.url)) {
      const figure = node('figure');
      const image = node('img');
      image.alt = L(item.img.alt);
      image.decoding = 'async';
      const caption = node('figcaption');
      if (item.img.source) {
        caption.append(link({label:item.img.credit, url:item.img.source}));
      } else {
        caption.textContent = L(item.img.credit);
      }
      figure.append(image, caption);
      image.addEventListener('load', () => {
        article.append(figure);
        article.classList.remove('is-text-only');
      }, {once:true});
      image.addEventListener('error', () => {
        failedImages.add(item.img.url);
      }, {once:true});
      image.src = item.img.url;
    }

    return article;
  }

  function renderArchiveDetail() {
    const item = days.find(item => item.date === opened);
    archiveDetail.hidden = !item;
    archiveDetail.replaceChildren(...(item ? [card(item)] : []));
    $$('button', rail).forEach(button => {
      button.setAttribute('aria-expanded', String(button.dataset.date === opened));
    });
  }

  function renderArchive() {
    const released = days.filter(item => item.date <= renderedDate).reverse();
    $('#daily-filters').hidden = !released.length;
    const matches = released.filter(item =>
      (!filters.type || item.type === filters.type) &&
      (!filters.country || item.country === filters.country || item.country === 'both')
    );
    if (!matches.some(item => item.date === opened)) opened = '';
    const entries = matches.map(item => {
      const entry = node('li');
      const button = node('button');
      button.type = 'button';
      button.dataset.date = item.date;
      button.setAttribute('aria-controls', archiveDetail.id);
      button.append(time(item.date), node('span', '', L(item)));
      button.addEventListener('click', () => {
        opened = opened === item.date ? '' : item.date;
        renderArchiveDetail();
      });
      entry.append(button);
      return entry;
    });
    rail.replaceChildren(...entries);
    rail.scrollLeft = 0;
    rail.hidden = !entries.length;
    note('#daily-archive-note', released.length
      ? (!entries.length && {en:'No picks match these filters yet.',zh:'暂时没有符合这些筛选条件的推荐。'})
      : {en:'Picks will appear here as the month unfolds.',zh:'这个月的推荐会陆续收在这里。'});
    renderArchiveDetail();
  }

  function renderFilters(kind, choices) {
    const group = $('#daily-' + kind + '-filters');
    group.replaceChildren(...choices.map(([value, label]) => {
      const button = node('button', 'daily-filter', L(label));
      button.type = 'button';
      button.setAttribute('aria-pressed', String(filters[kind] === value));
      button.addEventListener('click', () => {
        filters[kind] = value;
        $$('button', group).forEach(chip => chip.setAttribute('aria-pressed', String(chip === button)));
        renderArchive();
      });
      return button;
    }));
  }

  function render(now = new Date()) {
    renderedDate = dateKey(now);
    const pick = days.find(item => item.date === renderedDate) || (renderedDate < first.date ? first : last);
    $('#daily-today').replaceChildren(card(pick, 'feature'));
    let todayNote;
    if (renderedDate < first.date) todayNote = {en:'A little preview of the first pick.',zh:'先来看看第一天的推荐。'};
    if (renderedDate > last.date) todayNote = {en:'New picks coming soon.',zh:'新的推荐就快来了。'};
    note('#daily-today-note', todayNote);

    renderFilters('type', typeFilters);
    renderFilters('country', countryFilters);
    renderArchive();

    const events = EVENTS.filter(item => item.end >= renderedDate)
      .sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
    $('#daily-events').replaceChildren(...events.map(item => card(item)));
    note('#daily-events-note', !events.length && {en:'Check back for more exhibitions and performances.',zh:'之后再来看看近期有什么展演吧。'});
    $('#daily-favourites').replaceChildren(...FAVOURITES.map(item => card(item)));
  }

  function scheduleRefresh() {
    clearTimeout(midnightTimer);
    const now = new Date();
    if (dateKey(now) !== renderedDate) render(now);
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    midnightTimer = setTimeout(scheduleRefresh, tomorrow - now + 50);
  }

  Lab.onLang(() => {
    render();
    scheduleRefresh();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) scheduleRefresh();
  });
})();
</script>
</body>
</html>
