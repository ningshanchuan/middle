<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>朗读稿对比 · Genius Classroom</title>
<style>
/* Temporary review page: the page text of a clip next to two spoken scripts (rules + WeTextProcessing, and Codex
   written + Codex checked). Data: say-test.json in this folder. Not linked from the hub; noindex. */
:root{--bg:#f6f7f5;--panel:#fff;--fg:#1d2420;--muted:#5f6b64;--line:#dfe4e0;--accent:#2f6f5e;--bad:#b4532a;--fix:#3d63a8;--mark:#fff1c2}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--panel:#1c2320;--fg:#e4ebe7;--muted:#9aa8a0;--line:#2e3833;--accent:#7cc4ad;--bad:#e8875a;--fix:#8fb0ec;--mark:#4a4220;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.5rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px;max-width:75ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.bar button,.bar select{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.list{display:grid;gap:12px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.row .hd{font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px}
.grid b{font-weight:600;font-size:.82rem;color:var(--muted);padding-top:2px}
.grid div{overflow-wrap:anywhere;min-width:0}
.send{color:var(--muted)}
.why{color:var(--fix);font-size:.85rem}
.left{background:var(--mark);border-radius:3px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.grid b{padding-top:6px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>朗读稿对比</h1>
  <p class="lead">同一批 231 句页面文字，用两种方法转成给语音读的朗读稿。“规则”是固定规则加 WeTextProcessing；“Codex”是 Codex 逐句写、再由另一个 Codex 逐句检查后的结果。高亮的是语音读不准的残留符号或数字。</p>
  <div class="bar" id="bar"></div>
  <div class="list" id="list"></div>
</div>
<script>
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/[0-9\/+=×÷%°℃²³⁰¹⁴-⁹⁺⁻½¼¾⅓|∠_]+/g, m => `<span class="left">${m}</span>`);
let rows = [], view = 'all';
const VIEWS = [['all','全部'],['diff','两种方法不同'],['fixed','检查时改过'],['rulesbad','规则有残留']];
function bad(s){ return /[0-9\/+=×÷%°℃²³⁰¹⁴-⁹⁺⁻½¼¾⅓|∠_]/.test(s || ''); }
function render(){
  const pick = rows.filter(r => view === 'all' || (view === 'diff' && r.rules !== (r.chk || r.gen)) || (view === 'fixed' && r.changed) || (view === 'rulesbad' && bad(r.rules)));
  document.getElementById('list').innerHTML = pick.map(r => `
    <article class="row">
      <div class="hd">${esc(r.lesson)} · ${esc(r.cat)}</div>
      <div class="grid">
        <b>原文</b><div class="send">${esc(r.send)}</div>
        <b>规则</b><div>${mark(r.rules)}</div>
        <b>Codex</b><div>${mark(r.chk || r.gen)}${r.changed ? `<div class="why">检查时改过：${esc(r.why)}（初稿：${esc(r.gen)}）</div>` : ''}</div>
      </div>
    </article>`).join('') || '<p>没有。</p>';
}
fetch('say-test.json', {cache:'no-store'}).then(r => r.json()).then(d => {
  rows = d.rows;
  document.getElementById('bar').innerHTML = VIEWS.map(([id, n]) => {
    const c = id === 'all' ? rows.length : rows.filter(r => (id === 'diff' && r.rules !== (r.chk || r.gen)) || (id === 'fixed' && r.changed) || (id === 'rulesbad' && bad(r.rules))).length;
    return `<button type="button" data-v="${id}" aria-pressed="${id === view}">${n}（${c}）</button>`; }).join('');
  document.getElementById('bar').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v;
    document.querySelectorAll('#bar button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
  render();
});
</script>
</body>
</html>
